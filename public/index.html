<!-- =========================================================
     HERO SVG
========================================================= -->

<div class="hero-visual">

  <svg
    viewBox="0 0 440 440"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >

    <defs>

      <linearGradient
        id="heroStroke"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%"
      >
        <stop
          offset="0%"
          stop-color="#ff3b5c"
        />

        <stop
          offset="100%"
          stop-color="#ff6b81"
        />
      </linearGradient>

    </defs>


    <!-- Floating device -->

    <rect
      class="floaty"
      x="210"
      y="160"
      width="160"
      height="215"
      rx="16"
      fill="#131019"
      stroke="#2a2436"
      stroke-width="1.5"
    />

    <rect
      class="floaty"
      x="232"
      y="182"
      width="116"
      height="150"
      rx="8"
      fill="#1b1725"
    />

    <rect
      class="floaty"
      x="232"
      y="342"
      width="80"
      height="10"
      rx="3"
      fill="#1b1725"
    />

    <rect
      class="floaty"
      x="232"
      y="360"
      width="50"
      height="8"
      rx="3"
      fill="#1b1725"
    />


    <!-- Manga / download shape -->

    <path
      class="floaty"
      d="M 148 260
         L 148 320
         L 190 290
         L 232 320
         L 232 260"
      fill="none"
      stroke="url(#heroStroke)"
      stroke-width="12"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />


    <!-- Speed lines -->

    <g
      stroke="#ff3b5c"
      stroke-width="4"
      stroke-linecap="round"
      opacity=".8"
    >

      <line
        x1="70"
        y1="300"
        x2="40"
        y2="330"
      />

      <line
        x1="82"
        y1="308"
        x2="58"
        y2="332"
      />

    </g>

  </svg>

</div>


<!-- =========================================================
     EXTRACTOR
========================================================= -->

<div class="extract-container">

  <!-- Form -->

  <form
    id="extract-form"
    class="extract-form"
  >

    <div class="form-group">

      <label for="chapter-url">
        رابط الفصل
      </label>

      <input
        type="url"
        id="chapter-url"
        name="chapterUrl"
        placeholder="https://example.com/manga/chapter/1"
        autocomplete="off"
        required
      >

      <small>
        مثال:
        https://mangadex.org/chapter/xxxxx
      </small>

    </div>


    <!-- Extract button -->

    <button
      type="submit"
      class="btn btn-primary btn-lg"
      id="extract-button"
    >

      <svg
        class="icon"
        aria-hidden="true"
      >
        <use href="#ic-download"></use>
      </svg>

      <span>
        استخراج الصور
      </span>

    </button>

  </form>


  <!-- =======================================================
       STATUS
  ======================================================== -->

  <div
    id="extract-status"
    class="extract-status"
    aria-live="polite"
  >
    جاهز لاستخراج الصور
  </div>


  <!-- =======================================================
       RESULTS
  ======================================================== -->

  <div
    id="extract-results"
    class="extract-results hidden"
  >

    <!-- Results header -->

    <div class="results-header">

      <h3>
        تم استخراج الصور بنجاح ✅
      </h3>

      <p id="result-count">
        وجدنا
        <strong>0</strong>
        صورة
      </p>

    </div>


    <!-- Results actions -->

    <div class="results-actions">

      <button
        id="download-btn"
        class="btn btn-primary"
        type="button"
        disabled
      >

        <svg
          class="icon"
          aria-hidden="true"
        >
          <use href="#ic-download"></use>
        </svg>

        تحميل الصور

      </button>


      <button
        id="view-btn"
        class="btn btn-outline"
        type="button"
        disabled
      >

        <svg
          class="icon"
          aria-hidden="true"
        >
          <use href="#ic-book"></use>
        </svg>

        عرض المعاينة

      </button>


      <button
        id="copy-images"
        class="btn btn-outline"
        type="button"
        disabled
      >

        نسخ الروابط

      </button>


      <button
        id="download-json"
        class="btn btn-outline"
        type="button"
        disabled
      >

        تحميل JSON

      </button>

    </div>


    <!-- Gallery -->

    <div
      class="results-gallery"
      id="results-gallery"
    >

      <!-- Images will be loaded here -->

    </div>

  </div>


  <!-- =======================================================
       ERROR
  ======================================================== -->

  <div
    id="extract-error"
    class="extract-error hidden"
    role="alert"
  >

    <h3>
      حدث خطأ ❌
    </h3>

    <p id="error-message"></p>


    <button
      type="button"
      class="btn btn-outline"
      id="retry-btn"
    >

      حاول مرة أخرى

    </button>

  </div>


  <!-- =======================================================
       LOADING
  ======================================================== -->

  <div
    id="extract-loading"
    class="extract-loading hidden"
    aria-live="polite"
  >

    <svg
      class="icon loading-spinner"
      aria-hidden="true"
    >
      <use href="#ic-loader"></use>
    </svg>

    <p>
      جاري استخراج الصور...
    </p>

  </div>

</div>


<!-- =========================================================
     CLIENT SIDE EXTRACTOR
========================================================= -->

<script
  src="/js/extractor.js"
  defer
></script>
