<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MangaVault - تحميل فصل</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        .extract-page {
            min-height: 100vh;
            padding: 100px 20px 60px;
        }

        .extract-container {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .extract-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .extract-header h1 {
            margin-bottom: 12px;
        }

        .extract-header p {
            opacity: .7;
            max-width: 650px;
            margin: auto;
            line-height: 1.8;
        }

        .extract-card {
            background: #131019;
            border: 1px solid #2a2436;
            border-radius: 20px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px 16px;
            border-radius: 12px;
            border: 1px solid #332d40;
            background: #1b1725;
            color: #fff;
            outline: none;
            font-size: 15px;
            direction: ltr;
            text-align: left;
        }

        .form-group input:focus {
            border-color: #ff3b5c;
        }

        .form-group small {
            display: block;
            margin-top: 9px;
            opacity: .55;
            font-size: 12px;
            direction: rtl;
            text-align: right;
        }

        .extract-form .btn {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .extract-loading {
            text-align: center;
            padding: 35px 20px;
        }

        .loading-spinner {
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .extract-results {
            margin-top: 25px;
            padding: 25px;
            border-radius: 16px;
            background: #17131f;
            border: 1px solid #2a2436;
        }

        .results-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .results-header h3 {
            margin-bottom: 8px;
        }

        .results-header p {
            opacity: .7;
            margin: 0;
        }

        .results-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .results-actions button {
            flex: 1;
            min-width: 180px;
        }

        .extract-error {
            margin-top: 25px;
            padding: 25px;
            border-radius: 16px;
            background: rgba(255, 59, 92, .08);
            border: 1px solid rgba(255, 59, 92, .3);
            text-align: center;
        }

        .extract-error h3 {
            margin-top: 0;
        }

        .extract-error p {
            opacity: .75;
            line-height: 1.7;
        }

        .download-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #1b1725;
            border: 1px solid #2a2436;
            text-align: center;
            line-height: 1.7;
        }

        .preview-container {
            margin-top: 25px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .preview-grid img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 10px;
            background: #0f0c14;
            border: 1px solid #2a2436;
        }

        @media (max-width: 600px) {
            .extract-page {
                padding: 80px 14px 40px;
            }

            .extract-card {
                padding: 20px;
            }

            .results-actions {
                flex-direction: column;
            }

            .results-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- الصفحة -->
    <main class="extract-page">

        <div class="extract-container">

            <!-- العنوان -->
            <header class="extract-header">
                <h1>تحميل فصل مانجا</h1>

                <p>
                    ضع رابط الفصل، وسيقوم MangaVault باستخراج
                    صور الفصل وتجهيزها للتحميل.
                </p>
            </header>


            <!-- الكارت الرئيسي -->
            <section class="extract-card">

                <!-- Form -->
                <form id="extract-form" class="extract-form">

                    <div class="form-group">

                        <label for="chapter-url">
                            رابط الفصل
                        </label>

                        <input
                            type="url"
                            id="chapter-url"
                            name="chapterUrl"
                            placeholder="https://mangatek.com/reader/three-brothers/64"
                            required
                            autocomplete="off"
                        >

                        <small>
                            مثال:
                            https://mangatek.com/reader/three-brothers/64
                        </small>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary btn-lg"
                        id="extract-btn"
                    >
                        <svg class="icon">
                            <use href="#ic-download"></use>
                        </svg>

                        استخراج الصور
                    </button>

                </form>


                <!-- Loading -->
                <div
                    id="extract-loading"
                    class="extract-loading hidden"
                >

                    <svg class="icon loading-spinner">
                        <use href="#ic-loader"></use>
                    </svg>

                    <p>
                        جاري استخراج الصور...
                    </p>

                </div>


                <!-- Results -->
                <div
                    id="extract-results"
                    class="extract-results hidden"
                >

                    <div class="results-header">

                        <h3>
                            تم استخراج الفصل بنجاح ✅
                        </h3>

                        <p id="result-count">
                            وجدنا <strong>0</strong> صورة
                        </p>

                    </div>


                    <div class="results-actions">

                        <button
                            type="button"
                            id="download-btn"
                            class="btn btn-primary"
                        >
                            <svg class="icon">
                                <use href="#ic-download"></use>
                            </svg>

                            تحميل الصور
                        </button>


                        <button
                            type="button"
                            id="view-btn"
                            class="btn btn-outline"
                        >
                            <svg class="icon">
                                <use href="#ic-book"></use>
                            </svg>

                            عرض المعاينة
                        </button>

                    </div>


                    <!-- حالة التحميل -->
                    <div
                        id="download-status"
                        class="download-status hidden"
                    ></div>


                    <!-- Preview -->
                    <div
                        id="preview-container"
                        class="preview-container hidden"
                    >

                        <div class="preview-grid" id="results-gallery">
                        </div>

                    </div>

                </div>


                <!-- Error -->
                <div
                    id="extract-error"
                    class="extract-error hidden"
                >

                    <h3>
                        حدث خطأ ❌
                    </h3>

                    <p id="error-message"></p>

                    <button
                        type="button"
                        class="btn btn-outline"
                        id="retry-btn"
                    >
                        حاول مرة أخرى
                    </button>

                </div>

            </section>

        </div>

    </main>


    <!-- Icons -->
    <svg style="display:none">

        <symbol id="ic-download" viewBox="0 0 24 24">
            <path
                fill="currentColor"
                d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </symbol>

        <symbol id="ic-book" viewBox="0 0 24 24">
            <path
                fill="currentColor"
                d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"
            />

            <path
                fill="#131019"
                d="M4 5.5A2.5 2.5 0 0 1 6.5 3H8v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"
            />
        </symbol>

        <symbol id="ic-loader" viewBox="0 0 24 24">
            <circle
                cx="12"
                cy="12"
                r="9"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-dasharray="40 20"
            />
        </symbol>

    </svg>


    <!-- JavaScript -->
    <script src="/js/app.js"></script>

</body>
</html>
