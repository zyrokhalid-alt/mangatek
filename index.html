<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحمل المانجا إلى PDF</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #ff4757; }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #ff4757;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #ff6b81; }
        #status { margin-top: 1rem; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h1>تحميل الفصل كـ PDF 📚</h1>
        <form id="downloadForm">
            <input type="url" id="chapterUrl" placeholder="أدخل رابط فصل المانجا هنا..." required>
            <button type="submit" id="submitBtn">تحميل الـ PDF</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('chapterUrl').value;
            
            statusDiv.textContent = "جاري استخراج الصور وتحويلها لـ PDF... انتظر لحظات ⏳";
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('chapter_url', url);

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'حدث خطأ أثناء التحميل');
                }

                // تنزيل الملف تلقائياً
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = "manga_chapter.pdf";
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                statusDiv.textContent = "تم التحميل بنجاح! 🎉";
            } catch (err) {
                statusDiv.textContent = "❌ " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
